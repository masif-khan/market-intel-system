// ── Helpers ───────────────────────────────────────────────────
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(0)+"K":String(n||0);
const scoreColor = s => s>=75?"#22c55e":s>=50?"#eab308":"#ef4444";
const LABEL_CLS  = {"Hot Opportunity":"hot","Strong Signal":"strong","Worth Watching":"watch","Saturated":"sat","Too Early":"early"};
const ACTION_CLS = {"Publish Similar Game":"pub","Write Content Now":"write","Monitor Weekly":"mon","Skip":"skip"};
const TREND_COL  = {Exploding:"#22c55e",Rising:"#a3e635",Stable:"#eab308",Declining:"#ef4444"};

// ── Claude API ────────────────────────────────────────────────
async function callClaude(key, system, user) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,system,messages:[{role:"user",content:user}]}),
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||`HTTP ${res.status}`);}
  const data = await res.json();
  let text = data.content[0].text.trim();
  if(text.startsWith("```")){text=text.split("```")[1];if(text.startsWith("json"))text=text.slice(4);}
  return JSON.parse(text.trim());
}

// ── App Store Fetch (iTunes RSS — free, no key needed) ─────────
const IOS_CATS = [
  ["6014","Games"],["7001","Action"],["7003","Arcade"],["7004","Board"],
  ["7005","Card"],["7009","Puzzle"],["7010","Racing"],["7011","RPG"],
  ["7012","Simulation"],["7013","Sports"],["7014","Strategy"],["7015","Trivia"],["7016","Word"]
];

async function fetchAppStore(onLog) {
  const seen=new Set(); const results=[];
  for(const [id,name] of IOS_CATS){
    try{
      const r = await fetch(`https://itunes.apple.com/us/rss/topfreeapplications/limit=100/genre=${id}/json`);
      if(!r.ok) continue;
      const data = await r.json();
      const entries = data?.feed?.entry || [];
      for(const e of entries){
        const appId = e?.id?.attributes?.["im:id"]||"";
        if(!appId||seen.has(appId)) continue;
        seen.add(appId);
        const rel=(e?.["im:releaseDate"]?.label||"").slice(0,10);
        const ageDays=rel?Math.floor((Date.now()-new Date(rel))/86400000):999;
        results.push({
          title:       e?.["im:name"]?.label||"Unknown",
          app_id:      appId,
          platform:    "app_store",
          category:    name,
          store_url:   `https://apps.apple.com/us/app/id${appId}`,
          release_date:rel,
          age_days:    ageDays,
          icon:        e?.["im:image"]?.[2]?.label||"",
        });
      }
      onLog(`[iOS] ${name}: ${entries.length} apps`,"info");
    }catch(ex){onLog(`[iOS] ${name}: ${ex.message}`,"warn");}
    await new Promise(r=>setTimeout(r,200));
  }
  return results;
}

// ── Enrich iOS via iTunes Lookup ──────────────────────────────
async function enrichIOS(games, onLog) {
  const enriched=[];
  for(let i=0;i<games.length;i+=20){
    const batch=games.slice(i,i+20);
    const ids=batch.map(g=>g.app_id).join(",");
    try{
      const r=await fetch(`https://itunes.apple.com/lookup?id=${ids}&country=us`);
      if(!r.ok) continue;
      const data=await r.json();
      for(const info of(data.results||[])){
        const g=batch.find(x=>x.app_id===String(info.trackId));
        if(!g) continue;
        const reviews=info.userRatingCount||0;
        const installs=reviews*200;
        const rel=(info.releaseDate||"").slice(0,10);
        const age=rel?Math.floor((Date.now()-new Date(rel))/86400000):g.age_days;
        const daily=age>0?Math.floor(installs/age):0;
        enriched.push({
          ...g,
          title:       info.trackName||g.title,
          installs,
          daily_installs_est: daily,
          release_date:rel,
          age_days:    age,
          rating:      info.averageUserRating||0,
          reviews,
          description: (info.description||"").slice(0,400),
          genre:       info.primaryGenreName||g.category,
          developer:   info.artistName||"",
          price:       info.price||0,
          size:        info.fileSizeBytes||0,
          installs_estimated: true,
        });
      }
    }catch(ex){onLog(`[enrich iOS] ${ex.message}`,"warn");}
    await new Promise(r=>setTimeout(r,350));
  }
  onLog(`iOS enriched: ${enriched.length} apps`,"success");
  return enriched;
}

// ── Google Play via RapidAPI ──────────────────────────────────
const GP_CATS = [
  "GAME","GAME_ACTION","GAME_ARCADE","GAME_CASUAL","GAME_PUZZLE",
  "GAME_STRATEGY","GAME_SIMULATION","GAME_SPORTS","GAME_WORD",
  "GAME_TRIVIA","GAME_CARD","GAME_BOARD","GAME_ADVENTURE","GAME_ROLE_PLAYING"
];

async function fetchGPlay(rapidKey, onLog) {
  if(!rapidKey){
    onLog("[GP] No RapidAPI key — skipping Google Play","warn");
    return [];
  }
  const seen=new Set(); const results=[];
  for(const cat of GP_CATS){
    try{
      const r=await fetch(
        `https://google-play-scraper1.p.rapidapi.com/apps/top-charts?category=${cat}&chart=topselling_free&country=us&num=50&lang=en`,
        {headers:{"X-RapidAPI-Key":rapidKey,"X-RapidAPI-Host":"google-play-scraper1.p.rapidapi.com"}}
      );
      if(!r.ok){onLog(`[GP] ${cat}: HTTP ${r.status}`,"warn");continue;}
      const data=await r.json();
      const apps=data?.results||data?.apps||data||[];
      let n=0;
      for(const app of apps){
        const pid=app.appId||app.app_id||app.packageName||"";
        if(!pid||seen.has(pid)) continue;
        seen.add(pid); n++;
        results.push({
          title:       app.title||app.name||pid,
          package_id:  pid,
          platform:    "google_play",
          category:    cat.replace("GAME_","").replace("GAME","Games"),
          store_url:   `https://play.google.com/store/apps/details?id=${pid}`,
          installs:    app.installs||app.minInstalls||0,
          daily_installs_est: 0,
          rating:      app.score||app.rating||0,
          reviews:     app.ratings||app.reviews||0,
          age_days:    45,
          description: (app.summary||app.description||"").slice(0,400),
          developer:   app.developer||"",
          icon:        app.icon||"",
          release_date:"",
        });
      }
      onLog(`[GP] ${cat}: ${n} apps`,"info");
    }catch(ex){onLog(`[GP] ${cat}: ${ex.message}`,"warn");}
    await new Promise(r=>setTimeout(r,300));
  }
  onLog(`Google Play total: ${results.length} apps`,"success");
  return results;
}

// ── Claude Analysis (Option B — analyzes ALL apps) ────────────
const SYS_GAME=`You are a senior mobile games market intelligence analyst with 15+ years experience in ASO, publishing, and market trends.
Analyze mobile games and return structured JSON intelligence. You can estimate market signals even without exact install data — use category position, rating, reviews, description quality, and release timing.
Respond ONLY with valid JSON. No markdown, no extra text.`;

const SYS_TREND=`You are a mobile games market trend analyst. Identify macro trends, gaps, and opportunities from collections of game data.
Respond ONLY with valid JSON. No markdown, no extra text.`;

const gamePrompt=g=>`Analyze this mobile game's market opportunity. Even if install data is missing, estimate from category signals, rating, reviews, and description.

Return ONLY this exact JSON:
{"opportunity_score":<1-100>,"trend_score":<1-100>,"competition_score":<1-100>,"monetization_score":<1-100>,"opportunity_label":"<Hot Opportunity|Strong Signal|Worth Watching|Saturated|Too Early>","trend_direction":"<Exploding|Rising|Stable|Declining>","why_opportunity":"<2 sentences>","risk_factors":"<1 sentence>","aso_keywords":["<kw1>","<kw2>","<kw3>","<kw4>","<kw5>","<kw6>","<kw7>"],"competitor_gap":"<1 sentence>","target_audience":"<profile and age>","content_angle":"<best marketing angle>","monetization_model":"<ads|IAP|hybrid|subscription>","similar_games":["<g1>","<g2>","<g3>"],"recommended_action":"<Publish Similar Game|Write Content Now|Monitor Weekly|Skip>","one_line_summary":"<punchy single sentence>"}

GAME:
Title: ${g.title}
Platform: ${g.platform}
Category: ${g.category}
Position in top charts: top ${g.chartPosition||"100"}
Installs: ${g.installs?fmt(g.installs):"not available — estimate from signals"}
Daily est: ${g.daily_installs_est?fmt(g.daily_installs_est):"estimate needed"}
Age: ${g.age_days||"unknown"} days since release
Rating: ${g.rating||"unknown"}/5 (${g.reviews?fmt(g.reviews)+" reviews":"no review data"})
Developer: ${g.developer||"unknown"}
Description: ${g.description||"no description available"}`;

const trendPrompt=games=>`Analyze these ${games.length} trending mobile games and return market intelligence.

Return ONLY this exact JSON:
{"hot_categories":[{"category":"<n>","momentum":"<Exploding|Rising|Stable>","game_count":<n>,"avg_daily_installs":<n>,"insight":"<1-2 sentences>"}],"emerging_themes":[{"theme":"<name>","evidence":"<games>","opportunity":"<why now>"}],"market_gaps":[{"gap":"<niche>","evidence":"<why>","action":"<game type>"}],"top_opportunities":[{"title":"<game>","reason":"<why>"}],"keyword_trends":["<kw1>","<kw2>","<kw3>","<kw4>","<kw5>","<kw6>","<kw7>","<kw8>"],"audience_shifts":"<1-2 sentences>","platform_differences":"<1-2 sentences>","market_summary":"<3-4 sentence executive summary>"}

GAMES: ${JSON.stringify(games.map((g,i)=>({rank:i+1,title:g.title,platform:g.platform,category:g.category,installs:g.installs,daily:g.daily_installs_est,age:g.age_days,rating:g.rating,label:g.analysis?.opportunity_label,score:g.composite_score})))}`;

const computeScore=a=>!a?0:Math.round(Math.max(0,Math.min(100,
  (a.opportunity_score||0)*0.40+(a.trend_score||0)*0.30+(a.monetization_score||0)*0.20-(a.competition_score||0)*0.10
)));

const Spinner=({size=14})=><div style={{width:size,height:size,border:`2px solid rgba(255,255,255,0.15)`,borderTopColor:"#fff",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>;

// ── App ───────────────────────────────────────────────────────
function App(){
  const [apiKey,   setApiKey]   = useState(()=>localStorage.getItem("mi_key")||"");
  const [rapidKey, setRapidKey] = useState(()=>localStorage.getItem("mi_rapid")||"");
  const [keySaved, setKeySaved] = useState(()=>!!localStorage.getItem("mi_key"));
  const [page,     setPage]     = useState("dashboard");
  const [running,  setRunning]  = useState(false);
  const [progress, setProgress] = useState(0);
  const [steps,    setSteps]    = useState([]);
  const [logs,     setLogs]     = useState([]);
  const [results,  setResults]  = useState(()=>{try{return JSON.parse(localStorage.getItem("mi_results")||"null");}catch{return null;}});
  const [selected, setSelected] = useState(null);
  const [fLabel,   setFLabel]   = useState("all");
  const [fPlatform,setFPlatform]= useState("all");
  const [fAction,  setFAction]  = useState("all");
  const [sortBy,   setSortBy]   = useState("composite_score");
  const [maxGames, setMaxGames] = useState(80);
  const logRef = useRef(null);

  const log=useCallback((msg,type="muted")=>{
    const ts=new Date().toLocaleTimeString("en",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
    setLogs(l=>[...l.slice(-120),{msg:`[${ts}] ${msg}`,type}]);
    setTimeout(()=>{if(logRef.current)logRef.current.scrollTop=logRef.current.scrollHeight;},30);
  },[]);

  const updStep=(i,status)=>setSteps(s=>{const n=[...s];n[i]={...n[i],status};return n;});
  const saveKeys=()=>{localStorage.setItem("mi_key",apiKey);if(rapidKey)localStorage.setItem("mi_rapid",rapidKey);setKeySaved(true);};

  const runPipeline=async()=>{
    setRunning(true);setProgress(0);setLogs([]);
    setSteps([
      "Fetching App Store games",
      "Fetching Google Play games",
      "Enriching app details",
      "Claude AI analysis",
      "Macro trend analysis",
      "Saving dashboard",
    ].map(label=>({label,status:"pending"})));
    const aKey=localStorage.getItem("mi_key");
    const rKey=localStorage.getItem("mi_rapid")||"";

    try{
      // Step 1 — App Store
      updStep(0,"active");setProgress(5);
      log("Fetching App Store top charts...","info");
      const iosRaw=await fetchAppStore(log);
      log(`App Store: ${iosRaw.length} apps fetched`,"success");
      updStep(0,"done");setProgress(15);

      // Step 2 — Google Play
      updStep(1,"active");
      let gpRaw=[];
      if(rKey){
        log("Fetching Google Play via RapidAPI...","info");
        gpRaw=await fetchGPlay(rKey,log);
        log(`Google Play: ${gpRaw.length} apps fetched`,"success");
      } else {
        log("[GP] No RapidAPI key — add it in Settings to enable Google Play data","warn");
      }
      updStep(1,"done");setProgress(28);

      // Step 3 — Enrich
      updStep(2,"active");
      log("Enriching iOS apps via iTunes API...","info");
      const iosEnriched=await enrichIOS(iosRaw,log);
      // Mark chart positions
      const allApps=[
        ...iosEnriched.map((g,i)=>({...g,chartPosition:i+1})),
        ...gpRaw.map((g,i)=>({...g,chartPosition:i+1})),
      ];
      // OPTION B: Send ALL apps to Claude — no install filter
      // Limit to maxGames to control API cost
      const toAnalyze=allApps.slice(0,maxGames);
      log(`Total apps going to Claude: ${toAnalyze.length} (of ${allApps.length} fetched)`,"success");
      updStep(2,"done");setProgress(38);

      // Step 4 — Claude per game (Option B: ALL games analyzed)
      updStep(3,"active");
      const analyzed=[];
      const BATCH=5;
      for(let i=0;i<toAnalyze.length;i+=BATCH){
        const batch=toAnalyze.slice(i,i+BATCH);
        await Promise.all(batch.map(async game=>{
          try{
            const analysis=await callClaude(aKey,SYS_GAME,gamePrompt(game));
            const composite_score=computeScore(analysis);
            analyzed.push({...game,analysis,composite_score,analyzed_at:new Date().toISOString()});
            log(`✓ ${game.title} [${game.platform==="app_store"?"iOS":"GP"}] → ${analysis.opportunity_label} [${composite_score}]`,"success");
          }catch(ex){
            log(`✗ ${game.title}: ${ex.message}`,"warn");
            analyzed.push({...game,analysis:null,composite_score:0});
          }
        }));
        setProgress(38+Math.round((i/toAnalyze.length)*42));
        await new Promise(r=>setTimeout(r,600));
      }
      analyzed.sort((a,b)=>b.composite_score-a.composite_score);
      updStep(3,"done");setProgress(82);

      // Step 5 — Trend analysis
      updStep(4,"active");
      log("Running macro trend analysis...","info");
      let trend_report={};
      const valid=analyzed.filter(g=>g.analysis);
      try{
        trend_report=await callClaude(aKey,SYS_TREND,trendPrompt(valid));
        log("Trend report complete","success");
      }catch(ex){log(`Trend: ${ex.message}`,"warn");}
      updStep(4,"done");setProgress(96);

      // Step 6 — Save
      updStep(5,"active");
      const final={
        generated_at:    new Date().toISOString(),
        total_scanned:   allApps.length,
        total_analyzed:  analyzed.length,
        hot_count:       analyzed.filter(g=>g.analysis?.opportunity_label==="Hot Opportunity").length,
        strong_count:    analyzed.filter(g=>g.analysis?.opportunity_label==="Strong Signal").length,
        has_gplay:       gpRaw.length>0,
        trend_report,
        games:           analyzed,
      };
      localStorage.setItem("mi_results",JSON.stringify(final));
      setResults(final);
      updStep(5,"done");setProgress(100);
      log(`Pipeline complete! ${valid.length} games analyzed.`,"success");
      setTimeout(()=>setPage("dashboard"),1200);

    }catch(ex){log(`FATAL: ${ex.message}`,"error");}
    finally{setRunning(false);}
  };

  const games=results?.games||[];
  const filtered=games.filter(g=>{
    if(!g.analysis)return false;
    if(fLabel!=="all"&&g.analysis.opportunity_label!==fLabel)return false;
    if(fPlatform!=="all"&&g.platform!==fPlatform)return false;
    if(fAction!=="all"&&g.analysis.recommended_action!==fAction)return false;
    return true;
  }).sort((a,b)=>{
    if(sortBy==="installs")return(b.installs||0)-(a.installs||0);
    if(sortBy==="daily")return(b.daily_installs_est||0)-(a.daily_installs_est||0);
    if(sortBy==="rating")return(b.rating||0)-(a.rating||0);
    return b.composite_score-a.composite_score;
  });
  const trend=results?.trend_report||{};

  const NAV=[
    {id:"dashboard",icon:"🏠",label:"Dashboard"},
    {id:"run",icon:"▶",label:"Run Pipeline"},
    null,
    {id:"opportunities",icon:"🔥",label:"Opportunities"},
    {id:"trends",icon:"📈",label:"Trend Radar"},
    {id:"keywords",icon:"🔑",label:"Keyword Gaps"},
    null,
    {id:"settings",icon:"⚙",label:"Settings"},
  ];

  return(
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 24px",background:"var(--bg2)",borderBottom:"1px solid var(--border)",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:34,height:34,background:"linear-gradient(135deg,#7c5cfc,#06b6d4)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📊</div>
          <div>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:16,letterSpacing:"-0.3px"}}>Market Intel</div>
            <div style={{fontSize:11,color:"var(--muted2)"}}>Mobile Games Intelligence System</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          {results&&<span style={{fontSize:11,color:"var(--muted2)",fontFamily:"var(--mono)"}}>Last run: {new Date(results.generated_at).toLocaleString()}</span>}
          <div style={{width:7,height:7,borderRadius:"50%",background:results?"#22c55e":"var(--muted)",boxShadow:results?"0 0 8px #22c55e":"none"}}/>
          <span style={{fontSize:12,color:"var(--muted2)"}}>{results?"Data ready":"No data"}</span>
        </div>
      </div>

      <div style={{display:"flex",flex:1}}>
        {/* Sidebar */}
        <div style={{width:210,background:"var(--bg2)",borderRight:"1px solid var(--border)",padding:"16px 0",position:"sticky",top:57,height:"calc(100vh - 57px)",overflowY:"auto",flexShrink:0}}>
          {NAV.map((item,i)=>item===null
            ?<div key={i} style={{height:1,background:"var(--border)",margin:"10px 16px"}}/>
            :<div key={item.id} onClick={()=>setPage(item.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 16px",cursor:"pointer",fontSize:13,fontWeight:500,borderLeft:"2px solid transparent",transition:"all 0.15s",color:page===item.id?"var(--accent2)":"var(--muted2)",background:page===item.id?"rgba(124,92,252,0.08)":"transparent",borderLeftColor:page===item.id?"var(--accent)":"transparent"}}>
                <span style={{fontSize:14,width:18,textAlign:"center"}}>{item.icon}</span>
                {item.label}
                {item.id==="opportunities"&&results&&<span style={{marginLeft:"auto",fontSize:10,background:"rgba(124,92,252,0.15)",color:"var(--accent2)",padding:"1px 7px",borderRadius:99}}>{filtered.length}</span>}
              </div>
          )}
        </div>

        {/* Content */}
        <div style={{flex:1,padding:28,overflowX:"hidden"}}>

          {/* API KEY GATE */}
          {!keySaved&&(
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"70vh"}}>
              <div style={{...C.card,maxWidth:540,padding:36}}>
                <div style={{fontSize:42,marginBottom:16}}>📊</div>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:26,fontWeight:800,marginBottom:8,letterSpacing:"-0.5px"}}>Market Intel System</div>
                <p style={{color:"var(--muted2)",fontSize:14,marginBottom:28,lineHeight:1.7}}>Enter your API keys to start analyzing mobile game market opportunities across App Store and Google Play.</p>

                <label style={{fontSize:11,fontWeight:600,color:"var(--muted2)",letterSpacing:"0.5px",textTransform:"uppercase",display:"block",marginBottom:5}}>Anthropic API Key <span style={{color:"var(--red)"}}>*</span></label>
                <input style={{...C.input,marginBottom:6}} type="password" placeholder="sk-ant-api03-..." value={apiKey} onChange={e=>setApiKey(e.target.value)}/>
                <p style={{fontSize:11,color:"var(--muted)",marginBottom:20}}>Get at <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a> — required</p>

                <label style={{fontSize:11,fontWeight:600,color:"var(--muted2)",letterSpacing:"0.5px",textTransform:"uppercase",display:"block",marginBottom:5}}>RapidAPI Key <span style={{color:"var(--muted)"}}>optional</span></label>
                <input style={{...C.input,marginBottom:6}} type="password" placeholder="your-rapidapi-key..." value={rapidKey} onChange={e=>setRapidKey(e.target.value)}/>
                <p style={{fontSize:11,color:"var(--muted)",marginBottom:24}}>Free at <a href="https://rapidapi.com/search/google-play-scraper" target="_blank">rapidapi.com</a> — enables Google Play data (500 free req/month)</p>

                <button style={{...C.btn,width:"100%",justifyContent:"center",padding:13,fontSize:14}} onClick={saveKeys} disabled={!apiKey.startsWith("sk-")}>Launch System →</button>
              </div>
            </div>
          )}

          {/* DASHBOARD */}
          {keySaved&&page==="dashboard"&&(
            <div>
              <div style={C.pageTitle}>Dashboard</div>
              <div style={C.pageSub}>Mobile games market intelligence — all categories, no install filter</div>
              {!results?(
                <div style={{background:"linear-gradient(135deg,rgba(124,92,252,0.08),rgba(6,182,212,0.04))",border:"1px solid rgba(124,92,252,0.2)",borderRadius:12,padding:28,display:"flex",alignItems:"center",justifyContent:"space-between",gap:20}}>
                  <div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:700,marginBottom:6}}>No data yet</div>
                    <p style={{color:"var(--muted2)",fontSize:13}}>Run the pipeline to start analyzing trending games</p>
                  </div>
                  <button style={{...C.btn,padding:"13px 28px",fontSize:14,fontWeight:700,whiteSpace:"nowrap"}} onClick={()=>setPage("run")}>▶ Run Pipeline</button>
                </div>
              ):(
                <>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16,marginBottom:28}}>
                    {[
                      ["Total Scanned",(results.total_scanned||0).toLocaleString(),"var(--muted2)"],
                      ["Analyzed",results.total_analyzed||0,"var(--accent2)"],
                      ["Hot Opps",results.hot_count||0,"var(--green)"],
                      ["Strong Signals",results.strong_count||0,"#a3e635"],
                    ].map(([t,v,c])=>(
                      <div key={t} style={C.card}>
                        <div style={{fontSize:11,fontWeight:600,color:"var(--muted2)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:4}}>{t}</div>
                        <div style={{fontSize:30,fontWeight:800,fontFamily:"'Syne',sans-serif",color:c,marginBottom:4}}>{v}</div>
                      </div>
                    ))}
                  </div>

                  {!results.has_gplay&&(
                    <div style={{background:"rgba(234,179,8,0.06)",border:"1px solid rgba(234,179,8,0.2)",borderRadius:10,padding:"12px 16px",marginBottom:20,display:"flex",alignItems:"center",gap:12,fontSize:13}}>
                      <span>⚠️</span>
                      <span style={{color:"var(--yellow)"}}>Google Play data not included — add your RapidAPI key in <strong style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>setPage("settings")}>Settings</strong> to get GP games too.</span>
                    </div>
                  )}

                  {trend.market_summary&&(
                    <div style={{background:"linear-gradient(135deg,rgba(124,92,252,0.07),rgba(6,182,212,0.03))",border:"1px solid rgba(124,92,252,0.18)",borderRadius:10,padding:"16px 20px",marginBottom:28,fontSize:14,lineHeight:1.7}}>
                      <div style={{fontSize:11,fontWeight:600,color:"var(--accent2)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.5px"}}>📊 Market Summary</div>
                      {trend.market_summary}
                    </div>
                  )}

                  <div style={C.secTitle}>🏆 Top Opportunities</div>
                  <div style={{overflowX:"auto",marginBottom:20}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                      <thead><tr>{["#","Game","Platform","Score","Label","Action","Summary"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
                      <tbody>
                        {games.filter(g=>g.analysis).slice(0,10).map((g,i)=>(
                          <tr key={i} style={{cursor:"pointer"}} onClick={()=>{setSelected(g);setPage("opportunities");}}>
                            <td style={{...C.td,color:"var(--muted)",fontFamily:"var(--mono)",fontWeight:600}}>{i+1}</td>
                            <td style={{...C.td,fontWeight:600,maxWidth:180}}>{g.title}</td>
                            <td style={C.td}><Badge type={g.platform==="google_play"?"gp":"ios"}>{g.platform==="google_play"?"GP":"iOS"}</Badge></td>
                            <td style={{...C.td,minWidth:100}}><ScoreMeter score={g.composite_score}/></td>
                            <td style={C.td}><Badge type={LABEL_CLS[g.analysis.opportunity_label]}>{g.analysis.opportunity_label}</Badge></td>
                            <td style={C.td}><Badge type={ACTION_CLS[g.analysis.recommended_action]}>{g.analysis.recommended_action}</Badge></td>
                            <td style={{...C.td,fontSize:12,color:"var(--muted2)",maxWidth:250}}>{g.analysis.one_line_summary}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div style={{display:"flex",gap:10}}>
                    <button style={C.btn} onClick={()=>setPage("opportunities")}>View All →</button>
                    <button style={C.btnSec} onClick={()=>setPage("run")}>↻ Re-run Pipeline</button>
                  </div>
                </>
              )}
            </div>
          )}

          {/* RUN PIPELINE */}
          {keySaved&&page==="run"&&(
            <div>
              <div style={C.pageTitle}>Run Pipeline</div>
              <div style={C.pageSub}>Fetch all games → Claude analyzes every app → Full intelligence report</div>

              <div style={{...C.card,marginBottom:24}}>
                <div style={{...C.secTitle,marginBottom:14}}>⚙ Configuration</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:"var(--muted2)",textTransform:"uppercase",letterSpacing:"0.5px",display:"block",marginBottom:5}}>Max Games to Analyze</label>
                    <input style={C.input} type="number" min="10" max="200" value={maxGames} onChange={e=>setMaxGames(+e.target.value)}/>
                    <p style={{fontSize:11,color:"var(--muted)",marginTop:4}}>Higher = more data but more API cost. Recommended: 80</p>
                  </div>
                  <div style={{background:"var(--bg3)",borderRadius:8,padding:14}}>
                    <div style={{fontSize:11,fontWeight:600,color:"var(--muted2)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Est. API Cost</div>
                    <div style={{fontSize:20,fontWeight:800,fontFamily:"'Syne',sans-serif",color:"var(--green)"}}>${(maxGames*0.003).toFixed(2)}</div>
                    <div style={{fontSize:11,color:"var(--muted)",marginTop:4}}>~$0.003 per game analyzed</div>
                  </div>
                </div>
              </div>

              <div style={{background:"linear-gradient(135deg,rgba(124,92,252,0.08),rgba(6,182,212,0.04))",border:"1px solid rgba(124,92,252,0.2)",borderRadius:12,padding:24,display:"flex",alignItems:"center",justifyContent:"space-between",gap:20,marginBottom:24}}>
                <div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontSize:17,fontWeight:700,marginBottom:5}}>Start Full Pipeline</div>
                  <p style={{color:"var(--muted2)",fontSize:13}}>App Store{localStorage.getItem("mi_rapid")?" + Google Play":""} → Claude analyzes ALL {maxGames} games → Dashboard</p>
                </div>
                <button style={{...C.btn,padding:"13px 28px",fontSize:14,fontWeight:700,whiteSpace:"nowrap",opacity:running?0.6:1}} onClick={runPipeline} disabled={running}>
                  {running?<><Spinner/>Running...</>:"▶ Start Pipeline"}
                </button>
              </div>

              {steps.length>0&&(
                <div style={{marginBottom:24}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{fontSize:13,fontWeight:600}}>Progress</span>
                    <span style={{fontSize:13,color:"var(--accent2)",fontFamily:"var(--mono)"}}>{progress}%</span>
                  </div>
                  <div style={{height:6,background:"var(--bg3)",borderRadius:99,overflow:"hidden",marginBottom:14}}>
                    <div style={{height:"100%",width:`${progress}%`,background:"linear-gradient(90deg,var(--accent),var(--cyan))",borderRadius:99,transition:"width 0.4s ease"}}/>
                  </div>
                  {steps.map((s,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:7,marginBottom:5,fontSize:12,background:s.status==="active"?"rgba(124,92,252,0.08)":"var(--bg3)",border:s.status==="active"?"1px solid rgba(124,92,252,0.2)":"1px solid transparent",color:s.status==="done"?"var(--green)":s.status==="active"?"var(--text)":s.status==="error"?"var(--red)":"var(--muted2)"}}>
                      <span style={{fontSize:13,width:16,textAlign:"center"}}>{s.status==="done"?"✓":s.status==="active"?"⟳":s.status==="error"?"✗":"○"}</span>
                      {s.label}
                      {s.status==="active"&&<div style={{marginLeft:"auto"}}><Spinner size={12}/></div>}
                    </div>
                  ))}
                </div>
              )}

              {logs.length>0&&(
                <div ref={logRef} style={{background:"#080810",border:"1px solid var(--border)",borderRadius:10,padding:14,fontFamily:"var(--mono)",fontSize:11,maxHeight:240,overflowY:"auto"}}>
                  {logs.map((l,i)=>(
                    <div key={i} style={{marginBottom:3,lineHeight:1.6,color:l.type==="info"?"#7dd3fc":l.type==="success"?"var(--green)":l.type==="warn"?"var(--yellow)":l.type==="error"?"var(--red)":"var(--muted2)"}}>{l.msg}</div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* OPPORTUNITIES */}
          {keySaved&&page==="opportunities"&&(
            <div>
              <div style={C.pageTitle}>Opportunities</div>
              <div style={C.pageSub}>All analyzed games ranked by composite opportunity score — click any row for full detail</div>
              {games.length===0?(
                <div style={{textAlign:"center",padding:"60px 20px",color:"var(--muted2)"}}>
                  <div style={{fontSize:40,marginBottom:12}}>🔍</div>
                  <div style={{fontSize:16,fontWeight:600,marginBottom:6,color:"var(--text)"}}>No data yet</div>
                  <p>Run the pipeline first</p>
                </div>
              ):(
                <>
                  <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
                    {[
                      ["Label:",fLabel,setFLabel,["all","Hot Opportunity","Strong Signal","Worth Watching","Saturated","Too Early"]],
                      ["Platform:",fPlatform,setFPlatform,[["all","Both"],["google_play","Google Play"],["app_store","App Store"]]],
                      ["Action:",fAction,setFAction,["all","Publish Similar Game","Write Content Now","Monitor Weekly","Skip"]],
                      ["Sort:",sortBy,setSortBy,[["composite_score","Score"],["installs","Installs"],["daily","Daily"],["rating","Rating"]]],
                    ].map(([lbl,val,set,opts])=>(
                      <div key={lbl} style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontSize:12,color:"var(--muted2)"}}>{lbl}</span>
                        <select style={C.select} value={val} onChange={e=>set(e.target.value)}>
                          {opts.map(o=>Array.isArray(o)?<option key={o[0]} value={o[0]}>{o[1]}</option>:<option key={o} value={o}>{o}</option>)}
                        </select>
                      </div>
                    ))}
                    <span style={{marginLeft:"auto",fontSize:11,background:"var(--bg3)",border:"1px solid var(--border)",padding:"3px 10px",borderRadius:99,color:"var(--muted2)"}}>{filtered.length} games</span>
                  </div>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                      <thead><tr>{["#","Game","Platform","Category","Installs","Daily","Rating","Score","Label","Trend","Action"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
                      <tbody>
                        {filtered.map((g,i)=>(
                          <tr key={i} style={{cursor:"pointer"}} onClick={()=>setSelected(g)}
                            onMouseEnter={e=>e.currentTarget.style.background="rgba(124,92,252,0.04)"}
                            onMouseLeave={e=>e.currentTarget.style.background=""}>
                            <td style={{...C.td,color:"var(--muted)",fontFamily:"var(--mono)",fontWeight:700}}>{i+1}</td>
                            <td style={{...C.td,fontWeight:600,maxWidth:200}}>{g.title}</td>
                            <td style={C.td}><Badge type={g.platform==="google_play"?"gp":"ios"} style={{fontSize:10}}>{g.platform==="google_play"?"GP":"iOS"}</Badge></td>
                            <td style={{...C.td,fontSize:12,color:"var(--muted2)"}}>{g.category}</td>
                            <td style={{...C.td,fontFamily:"var(--mono)",fontSize:12}}>{g.installs?fmt(g.installs):"—"}</td>
                            <td style={{...C.td,fontFamily:"var(--mono)",fontSize:12}}>{g.daily_installs_est?fmt(g.daily_installs_est)+"/d":"—"}</td>
                            <td style={{...C.td,fontFamily:"var(--mono)",fontSize:12}}>{g.rating?g.rating.toFixed(1):"—"}</td>
                            <td style={{...C.td,minWidth:90}}><ScoreMeter score={g.composite_score}/></td>
                            <td style={C.td}><Badge type={LABEL_CLS[g.analysis?.opportunity_label]} style={{fontSize:10}}>{g.analysis?.opportunity_label}</Badge></td>
                            <td style={{...C.td,fontWeight:600,fontSize:12,color:TREND_COL[g.analysis?.trend_direction]||"var(--muted2)"}}>{g.analysis?.trend_direction}</td>
                            <td style={C.td}><Badge type={ACTION_CLS[g.analysis?.recommended_action]} style={{fontSize:10}}>{g.analysis?.recommended_action}</Badge></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </div>
          )}

          {/* TREND RADAR */}
          {keySaved&&page==="trends"&&(
            <div>
              <div style={C.pageTitle}>Trend Radar</div>
              <div style={C.pageSub}>Macro market intelligence across all analyzed games</div>
              {!trend.market_summary?(
                <div style={{textAlign:"center",padding:"60px 20px",color:"var(--muted2)"}}>
                  <div style={{fontSize:40,marginBottom:12}}>📈</div>
                  <div style={{fontSize:16,fontWeight:600,marginBottom:6,color:"var(--text)"}}>No data yet</div>
                  <p>Run the pipeline first</p>
                </div>
              ):(
                <>
                  <div style={{background:"linear-gradient(135deg,rgba(124,92,252,0.07),rgba(6,182,212,0.03))",border:"1px solid rgba(124,92,252,0.18)",borderRadius:10,padding:"16px 20px",marginBottom:28,fontSize:14,lineHeight:1.7}}>
                    <div style={{fontSize:11,fontWeight:600,color:"var(--accent2)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.5px"}}>Executive Summary</div>
                    {trend.market_summary}
                  </div>
                  <div style={C.secTitle}>🔥 Hot Categories</div>
                  <div style={{marginBottom:28}}>
                    {(trend.hot_categories||[]).map((c,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,padding:"10px 14px",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,flexWrap:"wrap"}}>
                        <span style={{fontSize:13,fontWeight:600,minWidth:130}}>{c.category}</span>
                        <Badge type={c.momentum==="Exploding"?"hot":c.momentum==="Rising"?"strong":"watch"} style={{fontSize:10}}>{c.momentum}</Badge>
                        <div style={{flex:1,minWidth:100,height:6,background:"var(--bg3)",borderRadius:99,overflow:"hidden"}}>
                          <div style={{height:"100%",width:`${Math.min(100,((c.avg_daily_installs||0)/50000)*100)}%`,background:TREND_COL[c.momentum]||"var(--accent)",borderRadius:99}}/>
                        </div>
                        <span style={{fontSize:11,color:"var(--muted2)",fontFamily:"var(--mono)",minWidth:65,textAlign:"right"}}>{fmt(c.avg_daily_installs||0)}/day</span>
                        <span style={{fontSize:12,color:"var(--muted2)",width:"100%",paddingTop:4}}>{c.insight}</span>
                      </div>
                    ))}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24,marginBottom:28}}>
                    <div>
                      <div style={C.secTitle}>💡 Emerging Themes</div>
                      {(trend.emerging_themes||[]).map((t,i)=>(
                        <div key={i} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:16,marginBottom:12}}>
                          <div style={{fontSize:10,fontWeight:700,color:"var(--accent2)",textTransform:"uppercase",letterSpacing:"0.6px",marginBottom:6}}>Theme</div>
                          <div style={{fontSize:14,fontWeight:600,marginBottom:8}}>{t.theme}</div>
                          <div style={{fontSize:12,color:"var(--muted2)",marginBottom:6,lineHeight:1.6}}><strong style={{color:"var(--muted)"}}>Evidence:</strong> {t.evidence}</div>
                          <div style={{fontSize:12,color:"var(--accent2)",lineHeight:1.6}}><strong>Opportunity:</strong> {t.opportunity}</div>
                        </div>
                      ))}
                    </div>
                    <div>
                      <div style={C.secTitle}>🎯 Market Gaps</div>
                      {(trend.market_gaps||[]).map((g,i)=>(
                        <div key={i} style={{background:"var(--bg2)",border:"1px solid rgba(124,92,252,0.15)",borderRadius:10,padding:16,marginBottom:12}}>
                          <div style={{fontSize:10,fontWeight:700,color:"var(--cyan)",textTransform:"uppercase",letterSpacing:"0.6px",marginBottom:6}}>Gap</div>
                          <div style={{fontSize:14,fontWeight:600,marginBottom:8}}>{g.gap}</div>
                          <div style={{fontSize:12,color:"var(--muted2)",marginBottom:8,lineHeight:1.6}}>{g.evidence}</div>
                          <div style={{padding:"7px 12px",background:"rgba(124,92,252,0.07)",borderRadius:6,fontSize:12,color:"var(--accent2)"}}>→ {g.action}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div style={C.secTitle}>👥 Audience & Platform</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                    {[["Audience Shifts",trend.audience_shifts],["Platform Differences",trend.platform_differences]].map(([title,body])=>(
                      <div key={title} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:16}}>
                        <div style={{fontSize:11,fontWeight:600,color:"var(--muted2)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>{title}</div>
                        <p style={{fontSize:13,color:"var(--text)",lineHeight:1.7}}>{body}</p>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>
          )}

          {/* KEYWORDS */}
          {keySaved&&page==="keywords"&&(
            <div>
              <div style={C.pageTitle}>Keyword Gaps</div>
              <div style={C.pageSub}>Market-wide trending keywords and per-game ASO opportunities</div>
              {!results?(
                <div style={{textAlign:"center",padding:"60px 20px",color:"var(--muted2)"}}>
                  <div style={{fontSize:40,marginBottom:12}}>🔑</div>
                  <div style={{fontSize:16,fontWeight:600,marginBottom:6,color:"var(--text)"}}>No data yet</div>
                  <p>Run the pipeline first</p>
                </div>
              ):(
                <>
                  <div style={C.secTitle}>📌 Market-Wide Trending Keywords</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:32}}>
                    {(trend.keyword_trends||[]).map((kw,i)=><KwTag key={i} primary>{kw}</KwTag>)}
                  </div>
                  <div style={C.secTitle}>🎮 Per-Game ASO Keywords</div>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                      <thead><tr>{["Game","Platform","Category","Score","Label","Keywords"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
                      <tbody>
                        {games.filter(g=>g.analysis?.aso_keywords?.length).map((g,i)=>(
                          <tr key={i} style={{cursor:"pointer"}} onClick={()=>{setSelected(g);setPage("opportunities");}}>
                            <td style={{...C.td,fontWeight:600}}>{g.title}</td>
                            <td style={C.td}><Badge type={g.platform==="google_play"?"gp":"ios"} style={{fontSize:10}}>{g.platform==="google_play"?"GP":"iOS"}</Badge></td>
                            <td style={{...C.td,fontSize:12,color:"var(--muted2)"}}>{g.category}</td>
                            <td style={C.td}><span style={{fontFamily:"var(--mono)",fontWeight:700,color:scoreColor(g.composite_score)}}>{g.composite_score}</span></td>
                            <td style={C.td}><Badge type={LABEL_CLS[g.analysis.opportunity_label]} style={{fontSize:10}}>{g.analysis.opportunity_label}</Badge></td>
                            <td style={C.td}><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{g.analysis.aso_keywords.map((kw,j)=><KwTag key={j} primary={j<3}>{kw}</KwTag>)}</div></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </div>
          )}

          {/* SETTINGS */}
          {keySaved&&page==="settings"&&(
            <div style={{maxWidth:520}}>
              <div style={C.pageTitle}>Settings</div>
              <div style={C.pageSub}>API keys and data management</div>

              <div style={{...C.card,marginBottom:16}}>
                <div style={{...C.secTitle,marginBottom:14}}>🔑 Anthropic API Key</div>
                <input style={{...C.input,marginBottom:14}} type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}/>
                <p style={{fontSize:11,color:"var(--muted)",marginBottom:14}}>Get at <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a></p>
                <div style={{display:"flex",gap:10}}>
                  <button style={C.btn} onClick={saveKeys}>Save</button>
                  <button style={C.btnDanger} onClick={()=>{localStorage.removeItem("mi_key");setApiKey("");setKeySaved(false);}}>Remove</button>
                </div>
              </div>

              <div style={{...C.card,marginBottom:16}}>
                <div style={{...C.secTitle,marginBottom:14}}>🎮 RapidAPI Key (Google Play)</div>
                <input style={{...C.input,marginBottom:8}} type="password" placeholder="your-rapidapi-key..." value={rapidKey} onChange={e=>setRapidKey(e.target.value)}/>
                <p style={{fontSize:11,color:"var(--muted)",marginBottom:14}}>
                  Free 500 req/month at <a href="https://rapidapi.com/search/google-play-scraper" target="_blank">rapidapi.com</a> → search "Google Play Scraper" → subscribe free → copy API key
                </p>
                <button style={C.btn} onClick={saveKeys}>Save</button>
              </div>

              <div style={{...C.card,marginBottom:16}}>
                <div style={{...C.secTitle,marginBottom:12}}>🗑 Data</div>
                <p style={{fontSize:13,color:"var(--muted2)",marginBottom:14}}>Clear stored results to start fresh.</p>
                <button style={C.btnDanger} onClick={()=>{localStorage.removeItem("mi_results");setResults(null);setPage("dashboard");}}>Clear All Results</button>
              </div>

              <div style={C.card}>
                <div style={{...C.secTitle,marginBottom:12}}>ℹ System Info</div>
                {[
                  ["Model","claude-sonnet-4-6"],
                  ["iOS Source","iTunes RSS + iTunes Lookup API (free)"],
                  ["GP Source","RapidAPI Google Play Scraper (500 free/month)"],
                  ["Analysis","All fetched games — no install filter"],
                  ["Storage","Browser localStorage only"],
                  ["Cost/run","~$0.003 per game analyzed"],
                ].map(([k,v])=>(
                  <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid var(--border)",fontSize:13,gap:12}}>
                    <span style={{color:"var(--muted2)",flexShrink:0}}>{k}</span>
                    <span style={{fontFamily:k==="Model"?"var(--mono)":"inherit",fontSize:k==="Model"?12:13,textAlign:"right"}}>{v}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      </div>

      {/* Footer */}
      <div style={{borderTop:"1px solid var(--border)",background:"var(--bg2)",padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
        <span style={{fontSize:12,color:"var(--muted)",letterSpacing:"0.3px"}}>Developed by</span>
        <a href="https://wa.me/923080698520" target="_blank" rel="noreferrer" style={{fontSize:12,fontWeight:700,fontFamily:"'Syne',sans-serif",background:"linear-gradient(90deg,#a78bfa,#06b6d4)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",textDecoration:"none"}}>Muhammad Asif</a>
      </div>

      {/* MODAL */}
      {selected&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}} onClick={()=>setSelected(null)}>
          <div style={{background:"var(--bg2)",border:"1px solid var(--border2)",borderRadius:16,width:"100%",maxWidth:680,maxHeight:"88vh",overflowY:"auto",padding:28}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
              <div>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800,marginBottom:8,letterSpacing:"-0.3px"}}>{selected.title}</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <Badge type={selected.platform==="google_play"?"gp":"ios"}>{selected.platform==="google_play"?"Google Play":"App Store"}</Badge>
                  <Badge type="early" style={{background:"var(--bg3)"}}>{selected.category}</Badge>
                  {selected.analysis&&<Badge type={LABEL_CLS[selected.analysis.opportunity_label]}>{selected.analysis.opportunity_label}</Badge>}
                </div>
              </div>
              <button style={{background:"none",border:"none",color:"var(--muted2)",fontSize:22,cursor:"pointer",padding:4}} onClick={()=>setSelected(null)}>✕</button>
            </div>
            {selected.analysis&&(
              <>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}}>
                  {[["Opportunity",selected.analysis.opportunity_score,"var(--green)"],["Trend",selected.analysis.trend_score,"var(--cyan)"],["Competition",selected.analysis.competition_score,"var(--red)"],["Monetization",selected.analysis.monetization_score,"var(--yellow)"]].map(([lbl,val,color])=>(
                    <div key={lbl} style={{background:"var(--bg3)",borderRadius:8,padding:"12px 10px",textAlign:"center"}}>
                      <div style={{fontSize:10,color:"var(--muted2)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:4}}>{lbl}</div>
                      <div style={{fontSize:26,fontWeight:800,fontFamily:"'Syne',sans-serif",color}}>{val}</div>
                    </div>
                  ))}
                </div>
                <div style={{background:"var(--bg3)",borderRadius:8,padding:"12px 16px",marginBottom:20}}>
                  <div style={{fontSize:11,color:"var(--muted2)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Composite Score</div>
                  <ScoreMeter score={selected.composite_score} size="lg"/>
                </div>
                {[
                  ["Why This Opportunity",selected.analysis.why_opportunity,null],
                  ["Target Audience",selected.analysis.target_audience,null],
                  ["Monetization Model",selected.analysis.monetization_model,null],
                  ["Content Angle",selected.analysis.content_angle,"var(--accent2)"],
                  ["Competitor Gap",selected.analysis.competitor_gap,null],
                  ["Risk Factors",selected.analysis.risk_factors,"var(--yellow)"],
                ].map(([label,value,color])=>(
                  <div key={label} style={{marginBottom:14}}>
                    <div style={{fontSize:11,color:"var(--muted2)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:4}}>{label}</div>
                    <p style={{fontSize:13,lineHeight:1.7,color:color||"var(--text)"}}>{value}</p>
                  </div>
                ))}
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11,color:"var(--muted2)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6}}>Recommended Action</div>
                  <Badge type={ACTION_CLS[selected.analysis.recommended_action]}>{selected.analysis.recommended_action}</Badge>
                </div>
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11,color:"var(--muted2)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>ASO Keywords</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:7}}>{(selected.analysis.aso_keywords||[]).map((kw,i)=><KwTag key={i} primary={i<3}>{kw}</KwTag>)}</div>
                </div>
                <div style={{marginBottom:16}}>
                  <div style={{fontSize:11,color:"var(--muted2)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:5}}>Similar Games</div>
                  <p style={{fontSize:13,color:"var(--muted2)"}}>{(selected.analysis.similar_games||[]).join(" · ")}</p>
                </div>
                <div style={{fontSize:12,padding:"10px 14px",background:"var(--bg3)",borderRadius:8}}>
                  <a href={selected.store_url} target="_blank" rel="noreferrer">{selected.store_url}</a>
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
