<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback } = React;

const fmt = n => n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(0)+"K":String(n||0);
const scoreColor = s => s>=75?"#22c55e":s>=50?"#eab308":"#ef4444";
const LABEL_CLS = {"Hot Opportunity":"hot","Strong Signal":"strong","Worth Watching":"watch","Saturated":"sat","Too Early":"early"};
const ACTION_CLS = {"Publish Similar Game":"pub","Write Content Now":"write","Monitor Weekly":"mon","Skip":"skip"};
const TREND_COLOR = {Exploding:"#22c55e",Rising:"#a3e635",Stable:"#eab308",Declining:"#ef4444"};

async function callClaude(apiKey, system, user) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,system,messages:[{role:"user",content:user}]}),
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||`HTTP ${res.status}`);}
  const data = await res.json();
  let text = data.content[0].text.trim();
  if(text.startsWith("```")){text=text.split("```")[1];if(text.startsWith("json"))text=text.slice(4);}
  return JSON.parse(text.trim());
}

const IOS_CATS=[["6014","Games"],["7001","Action"],["7003","Arcade"],["7004","Board"],["7005","Card"],["7009","Puzzle"],["7010","Racing"],["7011","RPG"],["7012","Simulation"],["7013","Sports"],["7014","Strategy"],["7015","Trivia"],["7016","Word"]];
const GP_CATS=[["GAME","Games"],["GAME_ACTION","Action"],["GAME_ARCADE","Arcade"],["GAME_CASUAL","Casual"],["GAME_PUZZLE","Puzzle"],["GAME_STRATEGY","Strategy"],["GAME_SIMULATION","Simulation"],["GAME_SPORTS","Sports"],["GAME_WORD","Word"],["GAME_TRIVIA","Trivia"],["GAME_CARD","Card"],["GAME_BOARD","Board"],["GAME_ADVENTURE","Adventure"]];

async function fetchAppStore(onLog){
  const seen=new Set();const results=[];
  for(const [id,name] of IOS_CATS){
    try{
      const r=await fetch(`https://itunes.apple.com/us/rss/topfreeapplications/limit=100/genre=${id}/json`);
      if(!r.ok)continue;
      const data=await r.json();
      for(const e of(data?.feed?.entry||[])){
        const appId=e?.id?.attributes?.["im:id"]||"";
        if(!appId||seen.has(appId))continue;
        seen.add(appId);
        const rel=(e?.["im:releaseDate"]?.label||"").slice(0,10);
        results.push({title:e?.["im:name"]?.label||"Unknown",app_id:appId,platform:"app_store",category:name,store_url:`https://apps.apple.com/us/app/id${appId}`,release_date:rel,age_days:rel?Math.floor((Date.now()-new Date(rel))/86400000):999});
      }
      onLog(`[iOS] ${name}: ${(data?.feed?.entry||[]).length} apps`,"info");
    }catch(ex){onLog(`[iOS] ${name}: ${ex.message}`,"warn");}
    await new Promise(r=>setTimeout(r,250));
  }
  return results;
}

async function fetchGPlay(onLog){
  const seen=new Set();const results=[];
  for(const [catId,name] of GP_CATS){
    try{
      const url=`https://play.google.com/store/games/category/${catId}?hl=en&gl=US`;
      const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,{signal:AbortSignal.timeout(10000)});
      if(!r.ok)continue;
      const data=await r.json();
      const matches=[...(data.contents||"").matchAll(/details\?id=([a-zA-Z0-9._]{5,})/g)];
      let n=0;
      for(const m of matches){
        const pid=m[1];
        if(!pid||seen.has(pid))continue;
        seen.add(pid);n++;
        results.push({title:pid.split(".").slice(-1)[0].replace(/([A-Z])/g," $1").trim(),package_id:pid,platform:"google_play",category:name,store_url:`https://play.google.com/store/apps/details?id=${pid}`,age_days:45});
        if(n>=25)break;
      }
      onLog(`[GP] ${name}: ${n} apps`,"info");
    }catch(ex){onLog(`[GP] ${name}: ${ex.message}`,"warn");}
    await new Promise(r=>setTimeout(r,350));
  }
  return results;
}

async function enrichIOS(games,cfg,onLog){
  const qualified=[];
  for(let i=0;i<games.length;i+=20){
    const batch=games.slice(i,i+20);
    const ids=batch.map(g=>g.app_id).join(",");
    try{
      const r=await fetch(`https://itunes.apple.com/lookup?id=${ids}&country=us`);
      if(!r.ok)continue;
      const data=await r.json();
      for(const info of(data.results||[])){
        const g=batch.find(x=>x.app_id===String(info.trackId));
        if(!g)continue;
        const reviews=info.userRatingCount||0;
        const installs=reviews*200;
        const rel=(info.releaseDate||"").slice(0,10);
        const age=rel?Math.floor((Date.now()-new Date(rel))/86400000):g.age_days;
        const daily=age>0?Math.floor(installs/age):0;
        if(age>cfg.maxAge||installs<cfg.minInstalls||daily<cfg.minDaily)continue;
        qualified.push({...g,title:info.trackName||g.title,installs,installs_estimated:true,release_date:rel,age_days:age,rating:info.averageUserRating||0,reviews,daily_installs_est:daily,description:(info.description||"").slice(0,300)});
      }
    }catch(ex){onLog(`[enrich iOS] ${ex.message}`,"warn");}
    await new Promise(r=>setTimeout(r,400));
  }
  onLog(`iOS qualified: ${qualified.length}`,"success");
  return qualified;
}

function prepGPlay(games){return games.slice(0,50).map(g=>({...g,installs:0,reviews:0,rating:0,daily_installs_est:0,description:`${g.category} game on Google Play`}));}

const SYS_GAME=`You are a mobile games market intelligence analyst. Analyze games and return structured JSON. Respond ONLY with valid JSON, no markdown.`;
const SYS_TREND=`You are a mobile games market trend analyst. Respond ONLY with valid JSON, no markdown.`;

const gamePrompt=g=>`Analyze this mobile game. Return ONLY this JSON, no extra text:
{"opportunity_score":<1-100>,"trend_score":<1-100>,"competition_score":<1-100>,"monetization_score":<1-100>,"opportunity_label":"<Hot Opportunity|Strong Signal|Worth Watching|Saturated|Too Early>","trend_direction":"<Exploding|Rising|Stable|Declining>","why_opportunity":"<2 sentences>","risk_factors":"<1 sentence>","aso_keywords":["<kw1>","<kw2>","<kw3>","<kw4>","<kw5>","<kw6>","<kw7>"],"competitor_gap":"<1 sentence>","target_audience":"<profile>","content_angle":"<best angle>","monetization_model":"<ads|IAP|hybrid|subscription>","similar_games":["<g1>","<g2>","<g3>"],"recommended_action":"<Publish Similar Game|Write Content Now|Monitor Weekly|Skip>","one_line_summary":"<punchy sentence>"}
Title:${g.title} Platform:${g.platform} Category:${g.category} Installs:${g.installs?fmt(g.installs):"unknown"} Daily:${g.daily_installs_est||"unknown"} Age:${g.age_days}days Rating:${g.rating||"unknown"} Desc:${g.description||"no description"}`;

const trendPrompt=games=>`Analyze these ${games.length} trending mobile games. Return ONLY this JSON:
{"hot_categories":[{"category":"<n>","momentum":"<Exploding|Rising|Stable>","game_count":<n>,"avg_daily_installs":<n>,"insight":"<1-2 sentences>"}],"emerging_themes":[{"theme":"<name>","evidence":"<games>","opportunity":"<why now>"}],"market_gaps":[{"gap":"<niche>","evidence":"<why>","action":"<game type>"}],"top_opportunities":[{"title":"<game>","reason":"<why>"}],"keyword_trends":["<kw1>","<kw2>","<kw3>","<kw4>","<kw5>","<kw6>","<kw7>","<kw8>"],"audience_shifts":"<1-2 sentences>","platform_differences":"<1-2 sentences>","market_summary":"<3-4 sentence summary>"}
GAMES:${JSON.stringify(games.map(g=>({title:g.title,platform:g.platform,category:g.category,installs:g.installs,daily:g.daily_installs_est,age:g.age_days,label:g.analysis?.opportunity_label,score:g.composite_score})))}`;

const computeScore=a=>!a?0:Math.round(Math.max(0,Math.min(100,(a.opportunity_score||0)*0.40+(a.trend_score||0)*0.30+(a.monetization_score||0)*0.20-(a.competition_score||0)*0.10)));

const badgeStyles={
  hot:{background:"rgba(34,197,94,0.12)",color:"#4ade80",border:"1px solid rgba(34,197,94,0.25)"},
  strong:{background:"rgba(163,230,53,0.1)",color:"#a3e635",border:"1px solid rgba(163,230,53,0.25)"},
  watch:{background:"rgba(234,179,8,0.1)",color:"#fbbf24",border:"1px solid rgba(234,179,8,0.25)"},
  sat:{background:"rgba(249,115,22,0.1)",color:"#fb923c",border:"1px solid rgba(249,115,22,0.25)"},
  early:{background:"rgba(107,114,128,0.12)",color:"#9ca3af",border:"1px solid rgba(107,114,128,0.25)"},
  gp:{background:"rgba(34,197,94,0.08)",color:"#4ade80",border:"1px solid rgba(34,197,94,0.2)"},
  ios:{background:"rgba(6,182,212,0.08)",color:"#22d3ee",border:"1px solid rgba(6,182,212,0.2)"},
  pub:{background:"rgba(34,197,94,0.1)",color:"#4ade80",border:"1px solid rgba(34,197,94,0.2)"},
  write:{background:"rgba(6,182,212,0.1)",color:"#22d3ee",border:"1px solid rgba(6,182,212,0.2)"},
  mon:{background:"rgba(234,179,8,0.1)",color:"#fbbf24",border:"1px solid rgba(234,179,8,0.2)"},
  skip:{background:"rgba(107,114,128,0.08)",color:"#9ca3af",border:"1px solid rgba(107,114,128,0.2)"},
};

const Badge=({type,children,style={}})=>(
  <span style={{display:"inline-flex",alignItems:"center",padding:"3px 9px",borderRadius:99,fontSize:11,fontWeight:600,whiteSpace:"nowrap",...(badgeStyles[type]||badgeStyles.early),...style}}>{children}</span>
);

const ScoreMeter=({score,size="sm"})=>(
  <div style={{display:"flex",alignItems:"center",gap:8}}>
    <div style={{flex:1,height:size==="lg"?8:4,background:"var(--bg4)",borderRadius:99,overflow:"hidden"}}>
      <div style={{width:`${score}%`,height:"100%",background:scoreColor(score),borderRadius:99,transition:"width 0.5s"}}/>
    </div>
    <span style={{fontSize:size==="lg"?16:12,fontWeight:700,fontFamily:"var(--mono)",color:scoreColor(score),minWidth:32}}>{score}</span>
  </div>
);

const Spinner=({size=14})=>(
  <div style={{width:size,height:size,border:`2px solid rgba(255,255,255,0.15)`,borderTopColor:"#fff",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>
);

const KwTag=({primary,children})=>(
  <span style={{padding:"3px 10px",borderRadius:6,fontSize:11,fontWeight:500,fontFamily:"var(--mono)",background:primary?"rgba(124,92,252,0.12)":"var(--bg3)",color:primary?"#c4b5fd":"var(--muted2)",border:primary?"1px solid rgba(124,92,252,0.25)":"1px solid var(--border)"}}>{children}</span>
);

function App(){
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("mi_key")||"");
  const [keySaved,setKeySaved]=useState(()=>!!localStorage.getItem("mi_key"));
  const [page,setPage]=useState("dashboard");
  const [running,setRunning]=useState(false);
  const [progress,setProgress]=useState(0);
  const [steps,setSteps]=useState([]);
  const [logs,setLogs]=useState([]);
  const [results,setResults]=useState(()=>{try{return JSON.parse(localStorage.getItem("mi_results")||"null");}catch{return null;}});
  const [selected,setSelected]=useState(null);
  const [cfg,setCfg]=useState({maxAge:90,minInstalls:500000,minDaily:5000});
  const [fLabel,setFLabel]=useState("all");
  const [fPlatform,setFPlatform]=useState("all");
  const [fAction,setFAction]=useState("all");
  const [sortBy,setSortBy]=useState("composite_score");
  const logRef=useRef(null);

  const log=useCallback((msg,type="muted")=>{
    const ts=new Date().toLocaleTimeString("en",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
    setLogs(l=>[...l.slice(-100),{msg:`[${ts}] ${msg}`,type}]);
    setTimeout(()=>{if(logRef.current)logRef.current.scrollTop=logRef.current.scrollHeight;},30);
  },[]);

  const updStep=(i,status)=>setSteps(s=>{const n=[...s];n[i]={...n[i],status};return n;});
  const saveKey=()=>{localStorage.setItem("mi_key",apiKey);setKeySaved(true);};

  const runPipeline=async()=>{
    setRunning(true);setProgress(0);setLogs([]);
    setSteps(["Fetching App Store games","Fetching Google Play games","Enriching & filtering","Claude AI analysis","Macro trend analysis","Saving dashboard"].map(label=>({label,status:"pending"})));
    const key=localStorage.getItem("mi_key");
    try{
      updStep(0,"active");setProgress(5);
      log("Fetching App Store top charts...","info");
      const iosRaw=await fetchAppStore(log);
      log(`App Store: ${iosRaw.length} apps found`,"success");
      updStep(0,"done");setProgress(18);

      updStep(1,"active");
      log("Fetching Google Play via proxy...","info");
      const gpRaw=await fetchGPlay(log);
      log(`Google Play: ${gpRaw.length} apps found`,"success");
      updStep(1,"done");setProgress(32);

      updStep(2,"active");
      log("Enriching iOS apps...","info");
      const iosQ=await enrichIOS(iosRaw,cfg,log);
      const gpQ=prepGPlay(gpRaw);
      const all=[...iosQ,...gpQ];
      log(`Total going into AI analysis: ${all.length}`,"success");
      updStep(2,"done");setProgress(45);

      updStep(3,"active");
      const analyzed=[];
      for(let i=0;i<all.length;i+=4){
        const batch=all.slice(i,i+4);
        await Promise.all(batch.map(async game=>{
          try{
            const analysis=await callClaude(key,SYS_GAME,gamePrompt(game));
            const composite_score=computeScore(analysis);
            analyzed.push({...game,analysis,composite_score,analyzed_at:new Date().toISOString()});
            log(`✓ ${game.title} → ${analysis.opportunity_label} [${composite_score}]`,"success");
          }catch(ex){
            log(`✗ ${game.title}: ${ex.message}`,"warn");
            analyzed.push({...game,analysis:null,composite_score:0});
          }
        }));
        setProgress(45+Math.round((i/all.length)*38));
        await new Promise(r=>setTimeout(r,700));
      }
      analyzed.sort((a,b)=>b.composite_score-a.composite_score);
      updStep(3,"done");setProgress(85);

      updStep(4,"active");
      log("Running macro trend analysis...","info");
      let trend_report={};
      try{
        trend_report=await callClaude(key,SYS_TREND,trendPrompt(analyzed.filter(g=>g.analysis)));
        log("Trend report complete","success");
      }catch(ex){log(`Trend: ${ex.message}`,"warn");}
      updStep(4,"done");setProgress(96);

      updStep(5,"active");
      const final={generated_at:new Date().toISOString(),total_scanned:iosRaw.length+gpRaw.length,total_analyzed:analyzed.length,hot_count:analyzed.filter(g=>g.analysis?.opportunity_label==="Hot Opportunity").length,strong_count:analyzed.filter(g=>g.analysis?.opportunity_label==="Strong Signal").length,trend_report,games:analyzed};
      localStorage.setItem("mi_results",JSON.stringify(final));
      setResults(final);
      updStep(5,"done");setProgress(100);
      log("Pipeline complete!","success");
      setTimeout(()=>setPage("dashboard"),1200);
    }catch(ex){log(`FATAL: ${ex.message}`,"error");}
    finally{setRunning(false);}
  };

  const games=results?.games||[];
  const filtered=games.filter(g=>{
    if(!g.analysis)return false;
    if(fLabel!=="all"&&g.analysis.opportunity_label!==fLabel)return false;
    if(fPlatform!=="all"&&g.platform!==fPlatform)return false;
    if(fAction!=="all"&&g.analysis.recommended_action!==fAction)return false;
    return true;
  }).sort((a,b)=>{
    if(sortBy==="installs")return(b.installs||0)-(a.installs||0);
    if(sortBy==="daily")return(b.daily_installs_est||0)-(a.daily_installs_est||0);
    if(sortBy==="rating")return(b.rating||0)-(a.rating||0);
    return b.composite_score-a.composite_score;
  });
  const trend=results?.trend_report||{};

  const sideItems=[
    {id:"dashboard",icon:"🏠",label:"Dashboard"},
    {id:"run",icon:"▶",label:"Run Pipeline"},
    null,
    {id:"opportunities",icon:"🔥",label:"Opportunities"},
    {id:"trends",icon:"📈",label:"Trend Radar"},
    {id:"keywords",icon:"🔑",label:"Keyword Gaps"},
    null,
    {id:"settings",icon:"⚙",label:"Settings"},
  ];

  const th={textAlign:"left",padding:"9px 13px",fontSize:11,fontWeight:600,color:"var(--muted2)",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid var(--border)",background:"var(--bg3)",whiteSpace:"nowrap"};
  const td={padding:"11px 13px",borderBottom:"1px solid var(--border)",verticalAlign:"top",lineHeight:1.5};
  const card={background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,padding:20};
  const secTitle={fontFamily:"'Syne',sans-serif",fontSize:15,fontWeight:700,marginBottom:16,paddingBottom:10,borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:8};
  const btnPrimary={background:"var(--accent)",color:"#fff",border:"none",padding:"10px 20px",borderRadius:8,fontWeight:600,fontSize:13,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:8};
  const btnDanger={background:"rgba(239,68,68,0.1)",color:"var(--red)",border:"1px solid rgba(239,68,68,0.25)",padding:"9px 18px",borderRadius:8,fontWeight:500,fontSize:13,cursor:"pointer"};
  const inputStyle={width:"100%",padding:"9px 13px",background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:8,color:"var(--text)",fontFamily:"var(--mono)",fontSize:13,outline:"none"};
  const selectStyle={padding:"7px 12px",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text)",fontSize:13,outline:"none",cursor:"pointer"};

  return (
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 24px",background:"var(--bg2)",borderBottom:"1px solid var(--border)",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:34,height:34,background:"linear-gradient(135deg,#7c5cfc,#06b6d4)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📊</div>
          <div>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:16,letterSpacing:"-0.3px"}}>Market Intel</div>
            <div style={{fontSize:11,color:"var(--muted2)"}}>Mobile Games Intelligence System</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          {results&&<span style={{fontSize:11,color:"var(--muted2)",fontFamily:"var(--mono)"}}>Last run: {new Date(results.generated_at).toLocaleString()}</span>}
          <div style={{width:7,height:7,borderRadius:"50%",background:results?"#22c55e":"var(--muted)",boxShadow:results?"0 0 8px #22c55e":"none",animation:results?"pulse 2s infinite":"none"}}/>
          <span style={{fontSize:12,color:"var(--muted2)"}}>{results?"Data ready":"No data"}</span>
        </div>
      </div>

      <div style={{display:"flex",flex:1}}>
        {/* Sidebar */}
        <div style={{width:210,background:"var(--bg2)",borderRight:"1px solid var(--border)",padding:"16px 0",position:"sticky",top:57,height:"calc(100vh - 57px)",overflowY:"auto",flexShrink:0}}>
          {sideItems.map((item,i)=>item===null?(
            <div key={i} style={{height:1,background:"var(--border)",margin:"10px 16px"}}/>
          ):(
            <div key={item.id} onClick={()=>setPage(item.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 16px",cursor:"pointer",fontSize:13,fontWeight:500,borderLeft:"2px solid transparent",transition:"all 0.15s",color:page===item.id?"var(--accent2)":"var(--muted2)",background:page===item.id?"rgba(124,92,252,0.08)":"transparent",borderLeftColor:page===item.id?"var(--accent)":"transparent"}}>
              <span style={{fontSize:14,width:18,textAlign:"center"}}>{item.icon}</span>
              {item.label}
              {item.id==="opportunities"&&results&&<span style={{marginLeft:"auto",fontSize:10,background:"rgba(124,92,252,0.15)",color:"var(--accent2)",padding:"1px 7px",borderRadius:99}}>{filtered.length}</span>}
            </div>
          ))}
        </div>

        {/* Main content */}
        <div style={{flex:1,padding:28,overflowX:"hidden"}}>

          {/* API KEY GATE */}
          {!keySaved&&(
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"70vh"}}>
              <div style={{...card,maxWidth:520,padding:36}}>

      {selected&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}} onClick={()=>setSelected(null)}>
          <div style={{background:"var(--bg2)",border:"1px solid var(--border2)",borderRadius:16,width:"100%",maxWidth:680,maxHeight:"88vh",overflowY:"auto",padding:28}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
              <div>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800,marginBottom:8,letterSpacing:"-0.3px"}}>{selected.title}</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <Badge type={selected.platform==="google_play"?"gp":"ios"}>{selected.platform==="google_play"?"Google Play":"App Store"}</Badge>
                  <Badge type="early" style={{background:"var(--bg3)"}}>{selected.category}</Badge>
                  {selected.analysis&&<Badge type={LABEL_CLS[selected.analysis.opportunity_label]}>{selected.analysis.opportunity_label}</Badge>}
                </div>
              </div>
              <button style={{background:"none",border:"none",color:"var(--muted2)",fontSize:22,cursor:"pointer",padding:4}} onClick={()=>setSelected(null)}>✕</button>
            </div>
            {selected.analysis&&(
              <>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}}>
                  {[["Opportunity",selected.analysis.opportunity_score,"var(--green)"],["Trend",selected.analysis.trend_score,"var(--cyan)"],["Competition",selected.analysis.competition_score,"var(--red)"],["Monetization",selected.analysis.monetization_score,"var(--yellow)"]].map(([lbl,val,color])=>(
                    <div key={lbl} style={{background:"var(--bg3)",borderRadius:8,padding:"12px 10px",textAlign:"center"}}>
                      <div style={{fontSize:10,color:"var(--muted2)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:4}}>{lbl}</div>
                      <div style={{fontSize:26,fontWeight:800,fontFamily:"'Syne',sans-serif",color}}>{val}</div>
                    </div>
                  ))}
                </div>
                <div style={{background:"var(--bg3)",borderRadius:8,padding:"12px 16px",marginBottom:20}}>
                  <div style={{fontSize:11,color:"var(--muted2)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Composite Score</div>
                  <ScoreMeter score={selected.composite_score} size="lg"/>
                </div>
                {[["Why This Opportunity",selected.analysis.why_opportunity,null],["Target Audience",selected.analysis.target_audience,null],["Monetization Model",selected.analysis.monetization_model,null],["Content Angle",selected.analysis.content_angle,"var(--accent2)"],["Competitor Gap",selected.analysis.competitor_gap,null],["Risk Factors",selected.analysis.risk_factors,"var(--yellow)"]].map(([label,value,color])=>(
                  <div key={label} style={{marginBottom:14}}>
                    <div style={{fontSize:11,color:"var(--muted2)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:4}}>{label}</div>
                    <p style={{fontSize:13,lineHeight:1.7,color:color||"var(--text)"}}>{value}</p>
                  </div>
                ))}
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11,color:"var(--muted2)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6}}>Recommended Action</div>
                  <Badge type={ACTION_CLS[selected.analysis.recommended_action]}>{selected.analysis.recommended_action}</Badge>
                </div>
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11,color:"var(--muted2)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>ASO Keywords</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:7}}>{(selected.analysis.aso_keywords||[]).map((kw,i)=><KwTag key={i} primary={i<3}>{kw}</KwTag>)}</div>
                </div>
                <div style={{marginBottom:16}}>
                  <div style={{fontSize:11,color:"var(--muted2)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:5}}>Similar Games</div>
                  <p style={{fontSize:13,color:"var(--muted2)"}}>{(selected.analysis.similar_games||[]).join(" · ")}</p>
                </div>
                <div style={{fontSize:12,padding:"10px 14px",background:"var(--bg3)",borderRadius:8}}>
                  <a href={selected.store_url} target="_blank" rel="noreferrer">{selected.store_url}</a>
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
